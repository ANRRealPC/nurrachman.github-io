<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANRRealPC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #4a4b4d;
            color: #ffffff;
        }

        /* Navigation Header */
        header {
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.8rem;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* Main Content Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 70px;
        }

        /* Section Layout */
        .profile-section {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        /* Image Styles */
        .img-square {
            width: 170px;
            height: 170px;
            object-fit: cover;
            filter: grayscale(100%);
        }

        .img-circle {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            filter: grayscale(100%);
        }

        /* Text Styles */
        .text-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .text-content h1 {
            font-size: 2.2rem;
            font-weight: normal;
            line-height: 1.3;
        }

        .text-content p {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            nav {
                gap: 20px;
            }
            nav a {
                font-size: 1.2rem;
            }
            .profile-section {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ANRRealPC</a>
        <nav>
            <a href="story.html">STORY</a>
            <a href="download.html">DOWNLOAD</a>
            <a href="meme.html">MEME</a>
        </nav>
    </header>

    <main class="container">
        <!-- Bagian 1: Cerita Sekolah -->
        <section class="profile-section" id="story">
            <img src="foto-sd.jpg" alt="Foto SD" class="img-square">
            <div class="text-content">
                <h1>Ceritaku dari Sekolah SD sampai SMA</h1>
            </div>
        </section>

        <!-- Bagian 2: Profil Alfi Nur Rachman -->
        <section class="profile-section">
            <img src="foto-profil.jpg" alt="Foto Alfi Nur Rachman" class="img-circle">
            <div class="text-content">
                <h1>Alfi Nur Rachman</h1>
                <p>Cita - Citaku Programmer dan Bisnis</p>
            </div>
        </section>
    </main>

</body>
</html>
